name: ShellCheck

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: scripts
          severity: warning

      - name: Verify scripts are executable
        run: |
          for script in scripts/*.sh; do
            test -f "$script"
            head -n1 "$script" | grep -q '^#!/'
          done
